name: Build and Domain Unit Tests

# Two test tiers:
#
# - build-and-test builds the whole solution and runs the *.Domain.UnitTests projects.
# - integration-tests runs the *.IntegrationTests projects against the Compose stack's Postgres and
#   Keycloak (compose.yml), the same way they run from the host locally (README.md). This tier holds
#   the money-safety concurrency tests and every query against a real Marten store, so a change
#   that breaks how Marten translates a filter shows up here and nowhere else.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/devcontainers/dotnet:2.1.4-11.0-preview
    env:
      ASPNETCORE_ENVIRONMENT: Development

    steps:
      - uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore ELifeRPG.Core.slnx

      - name: Build
        run: dotnet build ELifeRPG.Core.slnx --no-restore --configuration Release

      - name: Unit tests
        run: |
          for proj in $(find tests -iname "*.Domain.UnitTests.csproj"); do
            dotnet test "$proj" --no-build --configuration Release
          done


  integration-tests:
    # On the runner itself, not in the devcontainer image: docker compose needs the host's Docker,
    # and the stack bind-mounts infra/postgres and infra/keycloak from the checkout.
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ELIFERPG_TEST_DB: Host=localhost;Port=5433;Database=postgres;Username=postgres;Password=supersecret
      ELIFERPG_TEST_KEYCLOAK_URL: http://localhost:8180/

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Start Postgres and Keycloak
        run: docker compose up -d --wait postgres keycloak

      - name: Restore
        run: dotnet restore ELifeRPG.Core.slnx

      - name: Build
        run: dotnet build ELifeRPG.Core.slnx --no-restore --configuration Release

      # One project at a time: they share one Postgres and interfere when run in parallel.
      # A project that fails is retried once, because against a brand-new database test collections
      # race each other creating the Marten schema (README.md). A real failure fails both runs.
      - name: Integration tests
        run: |
          set -e
          for proj in $(find tests -iname "*.IntegrationTests.csproj" | sort); do
            if ! dotnet test "$proj" --no-build --configuration Release; then
              echo "::warning::$proj failed on the first run, retrying once"
              dotnet test "$proj" --no-build --configuration Release
            fi
          done

      - name: Stack logs
        if: failure()
        run: docker compose logs postgres keycloak

  image:
    needs: [build-and-test, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/eliferpg/backend
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker build -t "$IMAGE:edge" -t "$IMAGE:sha-${GITHUB_SHA::7}" .

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
